<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClipScript — Вход</title><style>body{margin:0;background:#0b1020;color:#f4f6ff;font:15px system-ui;padding:24px}.box{max-width:430px;margin:8vh auto;background:#121a2e;border:1px solid #293653;border-radius:18px;padding:24px}h1{margin:0 0 8px}p{color:#a2aec9}input{width:100%;box-sizing:border-box;margin:7px 0;padding:12px;border:1px solid #293653;border-radius:10px;background:#0c1426;color:#fff}.btn{border:0;border-radius:10px;padding:11px 14px;cursor:pointer;font-weight:700}.primary{width:100%;margin-top:10px;background:#a78bfa}.switch{background:transparent;color:#a78bfa}.msg{min-height:22px;margin-top:12px}.back{color:#a2aec9;text-decoration:none}</style></head><body><div class="box"><a class="back" href="/">← Вернуться в ClipScript</a><h1 id="title">Вход</h1><p id="hint">Войдите в аккаунт, чтобы сохранять генерации.</p><input id="email" type="email" placeholder="Email" autocomplete="email"><input id="password" type="password" placeholder="Пароль" autocomplete="current-password"><button class="btn primary" id="submit">Войти</button><button class="btn switch" id="switch">Нет аккаунта? Регистрация</button><div class="msg" id="msg"></div></div><script>
const URL="https://vwzustlexwkoxttmbceq.supabase.co",KEY="sb_publishable_hHQpSWME8rZSDFblXK8f0g_P2_snOKb";let mode="login";const $=id=>document.getElementById(id);function headers(){return{"apikey":KEY,"Content-Type":"application/json"}}function msg(s){$("msg").textContent=s}
function handleCallback(){const hash=new URLSearchParams(location.hash.replace(/^#/,""));const access_token=hash.get("access_token");const refresh_token=hash.get("refresh_token");const error=hash.get("error_description")||hash.get("error");if(error){msg("Ошибка подтверждения: "+decodeURIComponent(error));return false}if(access_token){localStorage.setItem("clipscript_session",JSON.stringify({access_token,refresh_token,token_type:hash.get("token_type")||"bearer",expires_in:Number(hash.get("expires_in")||3600)}));history.replaceState({},document.title,location.pathname);msg("Email подтверждён. Входим…");setTimeout(()=>location.href="/",300);return true}return false}
handleCallback();
$("switch").onclick=()=>{mode=mode==="login"?"signup":"login";$("title").textContent=mode==="login"?"Вход":"Регистрация";$("hint").textContent=mode==="login"?"Войдите в аккаунт, чтобы сохранять генерации.":"Создайте аккаунт ClipScript."; $("submit").textContent=mode==="login"?"Войти":"Создать аккаунт";$("switch").textContent=mode==="login"?"Нет аккаунта? Регистрация":"Уже есть аккаунт? Войти";$("password").autocomplete=mode==="login"?"current-password":"new-password";msg("")};
$("submit").onclick=async()=>{const email=$("email").value.trim(),password=$("password").value;if(!email){msg("Введите email");return}if(password.length<6){msg("Пароль минимум 6 символов");return}$("submit").disabled=true;msg("Подождите…");try{let endpoint=mode==="login"?"/auth/v1/token?grant_type=password":"/auth/v1/signup";const payload={email,password};if(mode==="signup")payload.options={email_redirect_to:location.origin+"/auth.html"};const r=await fetch(URL+endpoint,{method:"POST",headers:headers(),body:JSON.stringify(payload)});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error_description||d.msg||d.message||"Ошибка авторизации");if(d.access_token){localStorage.setItem("clipscript_session",JSON.stringify(d));msg("Вход выполнен. Открываем ClipScript…");setTimeout(()=>location.href="/",250)}else{msg("Аккаунт создан. Проверьте email и подтвердите регистрацию. После подтверждения вас автоматически вернёт в ClipScript.")}}catch(e){msg(e.message||"Ошибка")}finally{$("submit").disabled=false;$("submit").textContent=mode==="login"?"Войти":"Создать аккаунт"}};
</script></body></html>
